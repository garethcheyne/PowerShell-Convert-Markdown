name: Release

# A release is cut whenever main carries a version that has not been tagged yet.
# Bumping the version (ConvertMarkdown.psd1, ConvertMarkdown.psm1, README.md) and
# adding its CHANGELOG.md section in a PR is therefore the whole release process:
# merge the PR and this workflow tests, tags v<version> and publishes the release.

on:
  push:
    branches: [main]
    paths:
      - ConvertMarkdown.psd1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Import-PowerShellDataFile ./ConvertMarkdown.psd1).PrivateData.DisplayVersion
          $tagged = [bool](git tag --list "v$v")
          "version=$v" >> $env:GITHUB_OUTPUT
          "tagged=$($tagged.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($tagged) { Write-Host "v$v is already released; nothing to do." }

      - name: Install Pester
        if: steps.version.outputs.tagged == 'false'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Tests
        if: steps.version.outputs.tagged == 'false'
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1 -CI

      - name: Build package
        if: steps.version.outputs.tagged == 'false'
        shell: pwsh
        run: ./build/Build-Release.ps1 | Format-List

      - name: Publish GitHub Release
        if: steps.version.outputs.tagged == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "dist/ConvertMarkdown-$env:VERSION.zip"
          gh release create "v$env:VERSION" $zip "$zip.sha256" `
            --target $env:GITHUB_SHA `
            --title "ConvertMarkdown $env:VERSION" `
            --notes-file dist/release-notes.md
